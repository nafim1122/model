model_name: gpt2
reference_model: null  # if null, will clone model_name as ref
max_new_tokens: 256
batch_size: 8
forward_batch_size: 8
ppo_epochs: 1
learning_rate: 1.0e-5
kl_coef: 0.02
target_kl: 0.1
cliprange: 0.2
cliprange_value: 0.2
value_loss_coef: 1.0
entropy_coef: 0.0
seed: 42
save_steps: 200
log_with: null

# Decoding constraints
constrain_to_c: true
allowed_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_ \n\t\r{}()[]#<>/*+-=%&|!^,.;:\"'\\?"
## PPO configuration for RLHF (TRL-style)
# Save this file and pass it to your PPO runner (or load values into your trainer script).

model_name: sshleifer/tiny-gpt2  # change to your SFT model path for real runs
sft_model_path: runs/smoke_retrain
rm_model_path: runs/rm_demo
output_dir: runs/ppo

# Sampling / generation
max_new_tokens: 256
temperature: 0.2
do_sample: false

# PPO / optimization
ppo:
  steps: 2000
  batch_size: 8             # number of prompts per PPO update
  forward_batch_size: 4
  ppo_epochs: 4
  mini_batch_size: 4
  lr: 1e-5
  clip_range: 0.2
  kl_coef: 0.02
  vf_coef: 1.0
  ent_coef: 0.0
  max_grad_norm: 1.0

# Reward normalization
reward:
  running_mean: true
  clip_rewards: true
  clip_min: -10.0
  clip_max: 10.0

# LoRA / parameter-efficient tuning (optional when training policy)
lora:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ['q_proj','v_proj']

# Hardware
device: cuda
mixed_precision: fp16

# Safety / decoding constraints
constraints:
  enforce_c_only: true
  reject_non_c_regex: ".*\\b[A-Za-z]{2,} .*"  # example: reject outputs with prose (tune your regex)
